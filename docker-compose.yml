version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - .env

  backend:
    build:
      context: ./server
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./server/.env
